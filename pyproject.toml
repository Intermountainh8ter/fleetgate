[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetgate"
version = "0.2.0"
description = "Multi-agent triage of bare-metal fleet telemetry with policy-gated remediation and a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ammon Jackson" }]
dependencies = []
keywords = ["sre", "incident-response", "agents", "policy", "audit", "simulation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
fleetgate = "fleetgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleetgate = ["data/*.json", "data/policies/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:fleetgate.*"]

[tool.coverage.run]
source = ["fleetgate"]
branch = true

[tool.coverage.report]
show_missing = false
skip_covered = false
precision = 1

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["evals/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["SIM108", "B905", "UP007", "UP045"]
